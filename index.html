<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
</head>

<body>
    <div id="drawing"></div>
    <script>
        const draw = SVG().addTo('#drawing').viewbox(0, 0, 300, 140);
        // var rect = draw.rect(100, 100).attr({ x: 10, y: 0 }).fill('#f06');
        // fetch("./R_US.svg")
        // .then(resp => resp.text())
        // .then(text => {
        //     draw.svg(text);
        // });

        const center = (rect) => ({x: rect.x() + rect.width() / 2, y: rect.y() + rect.height() / 2});

        const rectA = draw
        .rect(10, 10)
        .attr({ x: 10, y: 0 })
        .fill('#f06');

        const rectB = draw
        .rect(10, 10)
        .attr({ x: 20, y: 20 })
        .fill('#f06');

        const connect = (rectA, rectB, ...midpoints) => {
            const aPosition = center(rectA)
            const bPosition = center(rectB)
            
            draw
            .polyline([[aPosition.x, aPosition.y], ...midpoints, [bPosition.x, bPosition.y]])
            .fill('none')
            .stroke({ color: '#f06', width: 1 })
        }

        connect(rectA, rectB, [100,50], [100,70]);
        
    </script>

</body>

</html>
